<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#b54cff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0d1117"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="12" opacity="0.15"/>
  <!-- Chart Candlestick drawings inside icon -->
  <g transform="translate(110, 136)" filter="url(#glow)">
    <!-- Candle 1 -->
    <line x1="60" y1="40" x2="60" y2="200" stroke="#ff3d71" stroke-width="8" stroke-linecap="round"/>
    <rect x="40" y="80" width="40" height="80" rx="4" fill="#ff3d71"/>
    
    <!-- Candle 2 -->
    <line x1="150" y1="20" x2="150" y2="220" stroke="#00e676" stroke-width="8" stroke-linecap="round"/>
    <rect x="130" y="60" width="40" height="120" rx="4" fill="#00e676"/>
    
    <!-- Candle 3 -->
    <line x1="240" y1="60" x2="240" y2="180" stroke="#00e676" stroke-width="8" stroke-linecap="round"/>
    <rect x="220" y="90" width="40" height="50" rx="4" fill="#00e676"/>
  </g>
</svg>
